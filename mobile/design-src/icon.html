<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0 }
  body { background: transparent }
  .tile { width: 1024px; height: 1024px; position: relative; overflow: hidden }
  .bg { position: absolute; inset: 0; background: linear-gradient(160deg, #FFE3EC 0%, #F3E1FA 50%, #E6D8FF 100%) }
  .blobs { position: absolute; inset: 0;
    background: radial-gradient(42% 42% at 26% 22%, rgba(255,160,130,.85) 0%, transparent 70%),
                radial-gradient(48% 48% at 80% 82%, rgba(176,128,255,.85) 0%, transparent 70%),
                radial-gradient(38% 38% at 85% 18%, rgba(255,150,200,.55) 0%, transparent 70%) }
  .heart { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) }
  .cap { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 42%) }
  .transparent .bg, .transparent .blobs, .transparent .cap { display: none }
  .mono .heart path { fill: #000 !important }
</style></head>
<body>
<div class="tile" id="tile">
  <div class="bg"></div><div class="blobs"></div>
  <svg class="heart" id="heart" width="600" height="600" viewBox="0 0 24 24">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FF8A5B"/><stop offset=".5" stop-color="#FF4F8B"/><stop offset="1" stop-color="#A855F7"/>
      </linearGradient>
      <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="0.9" stdDeviation="0.9" flood-color="#B0306E" flood-opacity=".35"/>
      </filter>
    </defs>
    <path filter="url(#soft)" fill="url(#g)" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    <path class="gloss" fill="url(#shine)" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </svg>
  <div class="cap"></div>
</div>
</body></html>
