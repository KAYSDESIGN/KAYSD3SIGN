name: MotoForge
options:
  bundleIdPrefix: app.motoforge
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # à renseigner localement pour signer sur iPhone
packages:
  MotoForgeKit:
    path: Packages/MotoForgeKit
targets:
  MotoForge:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MotoForgeKit
        product: MFDomain
      - package: MotoForgeKit
        product: MFEngine
      - package: MotoForgeKit
        product: MFCatalog
      - package: MotoForgeKit
        product: MFAI
      - package: MotoForgeKit
        product: MFPersistence
      - package: MotoForgeKit
        product: MFDesignSystem
      - package: MotoForgeKit
        product: MFRendering
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MOTOFORGE
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "Importer une couleur depuis une photo."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.motoforge.ios
        TARGETED_DEVICE_FAMILY: "1"
  MotoForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: MotoForge
schemes:
  MotoForge:
    build:
      targets:
        MotoForge: all
    test:
      targets:
        - MotoForgeUITests
        - package: MotoForgeKit/MFDomainTests
        - package: MotoForgeKit/MFEngineTests
        - package: MotoForgeKit/MFCatalogTests
        - package: MotoForgeKit/MFPersistenceTests
        - package: MotoForgeKit/MFRenderingTests
