name: iOS build & tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: Packages/MotoForgeKit
        run: swift test

  ios:
    name: Xcode build & tests (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/ci_pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project MotoForge.xcodeproj -scheme MotoForge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: .*\.swift|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build.log
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building -project MotoForge.xcodeproj -scheme MotoForge \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error|failed|passed|Test Suite|\*\*" || true
          grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" test.log
      - name: Screenshots
        if: always()
        run: |
          mkdir -p screenshots
          [ -d TestResults.xcresult ] && xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots 2>/dev/null || true
      - name: Error summary
        if: failure()
        run: grep -hE "error:" build.log test.log 2>/dev/null | sort -u | head -100 > errors.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: |
            build.log
            test.log
            errors.txt
            screenshots
          retention-days: 7
