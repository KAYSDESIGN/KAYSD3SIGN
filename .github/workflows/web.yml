name: Web (PWA)

on:
  push:
    paths: ['web/**', 'Packages/MotoForgeKit/Sources/MFCatalog/Resources/catalog.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-screenshots, path: web/e2e-shots, retention-days: 7 }
      # Deploys to the free Cloudflare Workers plan (workers.dev). Skipped unless the repository
      # secret CLOUDFLARE_API_TOKEN (scope: Workers Scripts: Edit) and variable CLOUDFLARE_ACCOUNT_ID exist.
      - name: Deploy
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/deploy-worker.mjs motoforge
